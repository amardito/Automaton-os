[project]
name = "automaton-os"
version = "0.1.0"
description = "Local AI Company / Jarvis-like multi-agent system using local and cloud model routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
    "python-dotenv",
    "ddgs",
    "rich",
    "apscheduler",
]

[project.optional-dependencies]
crews = [
    "crewai",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
automaton = "automaton_os.main:main"

[tool.ruff]
line-length = 100
src = ["src"]
